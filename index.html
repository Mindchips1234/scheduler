<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Scheduler</title>
  </head>
  <body>
    <header class="topbar">
      <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
      <h1 id="month-label">Scheduler</h1>
      <button class="icon-btn" id="next" aria-label="Next month">›</button>
      <button class="today-btn" id="today">Today</button>
      <button class="icon-btn gear" id="settings-btn" aria-label="Settings">⚙️</button>
    </header>

    <main>
      <section class="calendar" aria-label="Month">
        <div class="weekdays" id="weekdays"></div>
        <div class="grid" id="grid"></div>
      </section>

      <section class="agenda" aria-live="polite">
        <h2 id="day-label"></h2>
        <ul id="day-list" class="items"></ul>
        <div id="undated-wrap" hidden>
          <h3>No date</h3>
          <ul id="undated-list" class="items"></ul>
        </div>
      </section>
    </main>

    <div class="preview" id="preview" hidden>
      <div class="preview-card">
        <p class="heard" id="heard"></p>
        <label>Title <input id="p-title" /></label>
        <div class="row">
          <label>Date <input id="p-date" type="date" /></label>
          <label>Time <input id="p-time" type="time" /></label>
        </div>
        <div class="row">
          <label>Type
            <select id="p-type">
              <option value="event">Event</option>
              <option value="reminder">Reminder</option>
              <option value="task">Task</option>
            </select>
          </label>
          <label>Alert <select id="p-alert"></select></label>
        </div>
        <div class="row">
          <label>Repeat <select id="p-repeat"></select></label>
          <label id="p-until-wrap">Until (optional) <input id="p-until" type="date" /></label>
        </div>
        <div class="row actions">
          <button id="p-cancel" class="ghost">Cancel</button>
          <button id="p-save" class="primary">Save</button>
        </div>
      </div>
    </div>

    <div class="preview" id="settings" hidden>
      <div class="preview-card">
        <h2 class="sheet-title">Settings</h2>
        <div class="setting">
          <div><b>Notifications</b><p id="notify-state" class="hint"></p></div>
          <button id="notify-btn" class="ghost small">Turn on</button>
        </div>
        <label>Holidays
          <select id="s-holidays">
            <option value="auto">Automatic (from your device)</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="GB">United Kingdom</option>
            <option value="off">Don't show holidays</option>
          </select>
        </label>
        <label class="check-row"><input type="checkbox" id="s-observances" /> Also show other important days (Mother's Day, Halloween, clocks changing…)</label>
        <div class="row actions"><button id="settings-close" class="primary">Done</button></div>
      </div>
    </div>

    <div class="preview" id="choice" hidden>
      <div class="preview-card">
        <p id="choice-text" class="choice-text"></p>
        <div id="choice-buttons" class="choice-buttons"></div>
      </div>
    </div>

    <footer class="dock">
      <p id="status" class="status">Tap the mic and say something like “dentist next Tuesday at 3pm”.</p>
      <form id="text-form" class="text-form">
        <input id="text-input" placeholder="…or type it here" autocomplete="off" enterkeyhint="send" />
        <button id="mic" type="button" class="mic" aria-label="Speak a command">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
      </form>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
